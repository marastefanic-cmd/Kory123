# CI — there was none before 2026-07-26 (PHASE11 §3.5).
#
# ── ★★★★ WHAT THIS FILE USED TO BE, AND WHY IT IS A THIRD OF THE SIZE (2026-07-30) ───────────────
# Two of its three jobs existed to guard the wowsims harness: that the shipped wasm booted, that the
# duel protocol constants had not drifted, and that the request the PAGE built equalled the one the
# TERMINAL built. The sim is **retired** (user decision: *"I actually want you to retire the simming,
# it's doing more harm than good... we have the function/equation locked down and from now on we're
# better off on our own"*), so `sim/`, the harness tools and those gates are gone from the repo.
# What remains is the whole of what this project now checks, and it needs no browser, no Go toolchain
# and no network beyond the checkout: **the eight declared layouts** and **the closed forms**.
#
# ── ★ EVERY JOB CARRIES A NEGATIVE CONTROL, AND THAT IS NOT OPTIONAL ─────────────────────────────
# PHASE11's own rule: *"every new CI job needs a negative control (a deliberately-broken input that
# must fail) before its green is believed."* This project shipped **two** gates whose failure mode was
# a pass — B7 and B8, both in the deleted sim gates — and a green CI that inherits that shape is worse
# than no CI, because it converts "unchecked" into "checked". Where a test ships its own self-test, we
# run it and require it to FAIL.
#
# ── THE TWO KINDS OF CHECK, AND THEY MUST NOT BE CONFUSED ────────────────────────────────────────
# `anchors` asserts WHICH LAYOUT IS RIGHT — eight layouts the user declared. `law-check` and
# `self-consistency` assert something PRIOR: that the scorer agrees with the algebra the whole project
# is derived from, and with itself. A layout test cannot catch a mispriced buff (the goldens absorbed
# four for weeks); a closed form cannot tell you which plan a mage should press.
name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  the-tests:
    name: THE TESTS (the eight declared layouts) + the closed forms
    # ✅ BLOCKING as of 2026-07-30. This job carried `continue-on-error: true` with a stated exit
    # condition — *"flip it to false the day anchors goes green"* — because `docs/MODEL-DEFECTS.md` D1
    # was open and the declared layouts were its target. D1 closed (§8h–§8m), anchors reads **8 of 8**,
    # so the condition is met and the flag is gone.
    # ⛔ If this goes red, the correct response is NOT to restore `continue-on-error`. Run
    # `law-check` first and read which KIND of defect it is:
    #   · a press OUTSIDE its closed form  → a SCORING defect (law-check goes red with it)
    #   · a press on the wrong member of a plateau → a TIE-BREAK defect (law-check stays green)
    #   · a press the search never visited → a SEARCH defect (law-check stays green; brute-force the
    #     cell's neighbourhood to confirm). §8j, §8m and §8s were all this, and the last two were
    #     invisible to every aggregate the project owns.
    # They are fixed in three different places. Full record: docs/MODEL-DEFECTS.md §8h–§8t.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No browser, no rig, no golden file — it runs the real optimizer and compares press times.
      - name: the eight declared layouts
        run: node tests/anchors.mjs

      # The SCORER against the algebra, which is prior to any question about layouts. Every scoring
      # defect closed on 07-30 was caught this way and none would have been caught by a plan diff.
      # The constants the closed forms are algebra OVER — the one guard against post-sim circularity.
      # law-check confirms the scorer against forms we wrote; this confirms the numbers in them came
      # from somewhere outside the model. Cheap, and it fails the moment an uncited constant appears.
      - name: every GAME constant is sourced (constants-cited)
        run: node tools/constants-cited.mjs

      - name: …and its negative control
        run: node tools/constants-cited.mjs --self-test

      - name: the closed forms (law-check)
        run: node tools/law-check.mjs

      # NEGATIVE CONTROL: drop the millisecond quantisation from the gate's own law — a 3.6 % error on
      # the haste × haste line, the scale this gate exists to resolve — and require it to be CAUGHT.
      # --self-test inverts its exit contract, so green here means the break was seen.
      - name: '↳ negative control: an unquantised law must be CAUGHT'
        run: node tools/law-check.mjs --self-test

      # The scorer against ITSELF: the number that ranks vs a sum recomputed from the casts board,
      # plus the structural check that leaves the model and asks the physics (no cast may begin inside
      # an intermission). Generates its own corpus — 3000 scorings, no cache, works from a bare clone.
      # ⚠ The two lines answer different questions and the first alone is not sufficient: it printed a
      # clean 0.00e+0 straight through two defects worth up to 1.47 % of a fight score, because both
      # sides read the same board. The STRUCTURAL line is the one that caught them.
      # The opener toll against its closed form at every haste and every ramp entry stack. Turned
      # BLOCKING 07-31 when MODEL-DEFECTS §9a landed — the tool shipped in reporting mode while F1-F4
      # were open, and its own header names this as the moment to flip it. It is the only gate that
      # looks above the GCD floor, which is where F1 lived undetected: `law-check` asserted the toll at
      # h ≤ 600 and Bloodlust × Icy Veins reaches m = 1.56 at ZERO gear haste.
      - name: the opener toll against its closed form (toll-audit)
        run: node tools/toll-audit.mjs --strict

      # An INDEPENDENT transcription of the objective, written from the docs rather than the engine.
      # Shares no code with index.html, so agreement is evidence rather than a tautology.
      - name: the objective against an independent reference (objective-ref)
        run: node tools/objective-ref.mjs

      - name: the scorer against itself (self-consistency)
        run: node tools/self-consistency.mjs

      # The one stochastic mechanic against a direct seeded simulation of its own process — the
      # Ashtongue renewal law's falsifier now that the sim is retired (ESTABLISHED-FACTS §12).
      # Steady rates at MC tolerance; full fights (real ramp lattice) within the documented budget.
      - name: the Ashtongue proc against the real process (ati-mc)
        run: node tools/ati-mc.mjs

      # NEGATIVE CONTROL: swap the reference for the RETIRED down-lattice form (the pre-08-03
      # integrand, ~6× this gate's tolerance) and require it to be CAUGHT.
      - name: '↳ negative control: the retired proc model must be CAUGHT'
        run: node tools/ati-mc.mjs --self-test

  the-search:
    name: THE SEARCH (is every emitted plan a local optimum?)
    # ★★★★ ADDED 2026-07-30, and it closes the gap every other gate in this repo has.
    # The three defects that shipped WRONG PLANS this week — MODEL-DEFECTS §8j, §8m, §8s — were all
    # SEARCH misses, and not one was visible to anything above: `anchors` covers 8 declared cells,
    # `law-check` stayed correctly green (the scorer was right; the descent never visited the answer),
    # and `self-consistency` cannot see the search at all. §8s was found because the USER read two
    # plans and said they looked wrong. That is not a gate.
    # ⇒ Sweep every preset, then ask the objective directly whether a small SIMULTANEOUS move beats the
    # plan the tool emitted. On the pre-fix engine this independently rediscovers both reported misses,
    # to the digit (+0.005815 Karathress, +0.030041 Solarian).
    # ⚠ k=3 is not a luxury: on the 2:00 cell there were ZERO improving 1- and 2-coordinate moves and
    # six 3-coordinate ones. A k=1 or k=2 audit would have called that plan optimal.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ~30 s across 3 jobs. This is the expensive half; the audit itself is seconds and re-solves nothing.
      - name: sweep every preset
        run: node tools/plan-sweep.mjs index.html /tmp/sweep.json 3 --max-t=200

      - name: every emitted plan survives its neighbourhood
        run: node tools/search-audit.mjs /tmp/sweep.json --k=3

      # NEGATIVE CONTROL: displace one press in every emitted plan — the smallest nudge the engine's own
      # comparator calls strictly worse — and require EVERY one to be caught. A displaced plan that
      # audits clean would mean the neighbourhood asserts nothing. Inverts its exit contract.
      - name: '↳ negative control: a displaced press must be CAUGHT'
        run: node tools/search-audit.mjs /tmp/sweep.json --k=3 --self-test
