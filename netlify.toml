# Netlify deploy config for the Arcane Burn Planner.
#
# The app is index.html at the repo root — no framework, no dependencies, no build.
# ONE published file, and as of 2026-07-30 that is true again rather than aspirational:
# the in-page sim verifier is RETIRED (user decision — "I actually want you to retire
# the simming, it's doing more harm than good"), so `sim/`, `tools/genapl-core.mjs` and
# the eight lazily-loaded files this config used to copy are gone from the repo.
# Everything in docs/, tools/, tests/, README.md and CLAUDE.md stays unpublished —
# internal dev notes, not for browsing.

[build]
  publish = "dist"
  command = "mkdir -p dist && cp index.html dist/index.html"

# Defense-in-depth response headers. The page loads zero external resources and
# stores no data, so these are hygiene rather than necessity.
#
# No Content-Security-Policy is set on purpose: the optimizer runs in a Web
# Worker the app builds from an inline Blob URL, which a strict CSP would block
# and break the tool. With no external network surface to protect, a fragile CSP
# would be all cost and no benefit. (Can be added later if tested against the
# worker path.)
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), payment=(), usb=()"

# ⚠ THE CACHE-CONTROL SECTIONS ARE GONE WITH THE SIM, AND THE LESSON IN THEM IS NOT.
# They existed because `immutable` had been set on /sim/sim.wasm — a promise about a URL,
# on a URL whose bytes were rebuilt IN PLACE — so a returning visitor kept a year-cached
# engine while its shim updated immediately (PHASE11 §1.1 B3). If a mutable artifact at a
# stable URL is ever published again, it needs `no-cache` (revalidate, not re-download) or
# a content-hashed filename, and the policy must be written as a GLOB over the whole bundle:
# the first draft of that fix enumerated filenames and silently omitted one.
